---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redises.redis.jgaskins.dev
spec:
  group: redis.jgaskins.dev
  names:
    categories: []
    kind: Redis
    plural: redises
    shortNames:
    - rds
    singular: redis
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.masterPod
      name: Primary
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.replicas
      name: Desired
      type: integer
    - description: Replicas connected to primary
      jsonPath: .status.connectedReplicas
      name: Connected
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RedisSpec via `CustomResource`
        properties:
          spec:
            properties:
              evictionPolicy:
                description: |-
                  Redis's `maxmemory-policy`: what to do with the keyspace once `maxmemory`
                  is reached. Modelled as an enum for the same reason `FsyncPolicy` is — the
                  API server rejects a bad value at `kubectl apply` time, where redis-server
                  would refuse to start and surface it as a CrashLoopBackOff instead.

                  The `allkeys-*` variants may evict any key; the `volatile-*` variants only
                  consider keys carrying a TTL, and behave like `noeviction` when none of the
                  keys in memory have one — a cache built without TTLs gets write errors under
                  a `volatile-*` policy, not evictions.

                  Two things to weigh before moving off the default:

                  - Eviction deletes committed data. An evicted key is dropped from the RDB
                    and AOF along with everything else, so anything but `noeviction` turns the
                    deployment into a cache whether or not persistence is on.
                  - The ceiling is per pod. `maxmemory` is one node's limit, so under Redis
                    Cluster the fullest shard starts evicting while the rest may be near
                    empty, and the policy applies to every pod because a StatefulSet has a
                    single pod template. Replicas don't evict independently — since Redis 5
                    they wait for the primary's `DEL` — so it only acts on the current master.
                enum:
                - noeviction
                - allkeys-lru
                - allkeys-lfu
                - allkeys-random
                - volatile-lru
                - volatile-lfu
                - volatile-random
                - volatile-ttl
                nullable: true
                type: string
              image:
                default: redis:8
                type: string
              persistence:
                description: |-
                  How the dataset is written to disk. Defaults to both RDB and AOF on,
                  with AOF fsyncing once a second. See `PersistenceSpec`.
                nullable: true
                properties:
                  aof:
                    description: Append-only file logging.
                    nullable: true
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      fsync:
                        description: |-
                          Redis's `appendfsync` policy. Modelled as an enum so the API server rejects
                          a bad value at `kubectl apply` time — redis-server refuses to start on an
                          unrecognised one, which would otherwise surface as a CrashLoopBackOff.

                          The third variant is spelled `never` rather than Redis's own `no`. `no` is
                          unusable as a schema enum value here: serde_yaml emits it bare (YAML 1.2,
                          where it is a string), but the API server parses CRDs with go-yaml's YAML
                          1.1, where bare `no` is the boolean `false` — which would land a boolean
                          inside a `type: string` enum and make the value unmatchable. Spelling it
                          `never` sidesteps that, and spares users the same quoting trap in their own
                          manifests. It maps to `appendfsync no` on the redis-server command line.
                        enum:
                        - always
                        - everysec
                        - never
                        nullable: true
                        type: string
                    type: object
                  enabled:
                    default: true
                    description: |-
                      Master switch. When false, both RDB and AOF are disabled regardless of
                      the `rdb` and `aof` blocks below and Redis runs as a pure in-memory
                      cache, losing its dataset on every restart.
                    type: boolean
                  rdb:
                    description: Point-in-time snapshotting (`save` / `BGSAVE`).
                    nullable: true
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      save:
                        description: |-
                          Snapshot triggers, each `"<seconds> <changes>"` — snapshot when at
                          least `changes` keys changed within `seconds`. Defaults to Redis's own
                          `3600 1`, `300 100`, `60 10000`.

                          An empty list schedules no automatic snapshots, which is the same thing
                          `enabled: false` does: both emit `--save ""`. Neither stops Redis from
                          producing an RDB for a replication full sync or an explicit `BGSAVE` —
                          there is no Redis setting that does.
                        items:
                          pattern: ^\d+ \d+$
                          type: string
                        nullable: true
                        type: array
                    type: object
                type: object
              podDisruptionBudget:
                description: |-
                  Overrides the automatic PodDisruptionBudget for the Redis data pods.

                  Created automatically whenever `replicas` is 2 or more, with
                  `maxUnavailable: 1` and `unhealthyPodEvictionPolicy: AlwaysAllow` — one
                  pod disrupted at a time, which keeps the workload usable through a node
                  drain and matches Sentinel's `parallel-syncs 1` so failovers stay
                  serialised. Below 2 replicas none is created, because a budget over a
                  single pod either does nothing or blocks every drain.

                  Set explicitly to override; set to `{}` (neither field) to opt out and
                  have no PDB at all. Overrides are validated against `replicas` — at most
                  `replicas - 1` may be unavailable at once, so at least one copy of the
                  data survives — and an unsafe budget is refused rather than applied. See
                  `PodDisruptionBudgetSpec`.
                nullable: true
                properties:
                  maxUnavailable:
                    description: Integer or percentage. Mutually exclusive with `minAvailable`.
                    nullable: true
                    x-kubernetes-int-or-string: true
                  minAvailable:
                    description: Integer or percentage (e.g. `1` or `"50%"`).
                    nullable: true
                    x-kubernetes-int-or-string: true
                  unhealthyPodEvictionPolicy:
                    description: |-
                      `IfHealthyBudget` (the Kubernetes default) or `AlwaysAllow`.

                      Under `IfHealthyBudget`, a pod that is *already* unready cannot be
                      evicted once the budget is spent — which stalls `kubectl drain` during
                      exactly the incident you are draining for. `AlwaysAllow` lets an
                      already-unready pod go, since it is not serving traffic anyway, while
                      healthy pods are still held to the budget. Requires Kubernetes 1.27+
                      (GA in 1.31); older API servers silently drop the field.
                    nullable: true
                    type: string
                type: object
              replicas:
                default: 1
                format: int32
                type: integer
              resources:
                description: |-
                  Container resource requests/limits for the Redis pods. Defaults: 1Gi
                  memory (requests and limits), 1.2 CPU requests, 2 CPU limits. User
                  values are merged per-key with the defaults — overriding `cpu` alone
                  preserves the default memory settings, and vice versa.

                  `maxmemory` is derived from the effective memory limit (70%) and
                  passed to redis-server, so users don't need to keep it in sync
                  manually.
                nullable: true
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                type: object
              sentinel:
                description: |-
                  When set, the operator deploys a Redis Sentinel StatefulSet alongside
                  the Redis pods to provide automatic failover. Clients that aren't
                  Sentinel-aware can still use the `<name>-primary` Service, whose
                  selector the operator updates to track the current master.
                nullable: true
                properties:
                  image:
                    description: |-
                      Override image for Sentinel pods. Defaults to the Redis spec image —
                      `redis-sentinel` ships in the same container as `redis-server`.
                    nullable: true
                    type: string
                  podDisruptionBudget:
                    description: |-
                      Overrides the automatic Sentinel PodDisruptionBudget.

                      Unlike the other budgets, this one is created automatically: losing
                      Sentinel quorum silently disables failover, so it is opt-out rather than
                      opt-in. Whenever Sentinel is enabled with 3 or more replicas the operator
                      creates a PDB whose `minAvailable` is the number of sentinels needed both
                      to agree the master is down (`quorum`) and to elect a failover leader (a
                      majority of the sentinel set) — whichever is larger — with
                      `unhealthyPodEvictionPolicy: AlwaysAllow`.

                      Below 3 replicas no PDB is created, because `minAvailable` would equal
                      the replica count and block every node drain forever.

                      Set explicitly to override; set to `{}` (neither field) to opt out and
                      have no PDB at all.
                    nullable: true
                    properties:
                      maxUnavailable:
                        description: Integer or percentage. Mutually exclusive with `minAvailable`.
                        nullable: true
                        x-kubernetes-int-or-string: true
                      minAvailable:
                        description: Integer or percentage (e.g. `1` or `"50%"`).
                        nullable: true
                        x-kubernetes-int-or-string: true
                      unhealthyPodEvictionPolicy:
                        description: |-
                          `IfHealthyBudget` (the Kubernetes default) or `AlwaysAllow`.

                          Under `IfHealthyBudget`, a pod that is *already* unready cannot be
                          evicted once the budget is spent — which stalls `kubectl drain` during
                          exactly the incident you are draining for. `AlwaysAllow` lets an
                          already-unready pod go, since it is not serving traffic anyway, while
                          healthy pods are still held to the budget. Requires Kubernetes 1.27+
                          (GA in 1.31); older API servers silently drop the field.
                        nullable: true
                        type: string
                    type: object
                  quorum:
                    description: |-
                      Quorum required to flag the master as objectively down and trigger
                      failover. Defaults to majority of `replicas`. Lower values risk
                      split-brain during network partitions.
                    format: int32
                    nullable: true
                    type: integer
                  replicas:
                    default: 3
                    description: |-
                      Number of Sentinel pods. Should be ≥ 3 — Sentinel needs majority
                      quorum to declare a master down, so 2 sentinels can't tolerate any
                      failure.
                    format: int32
                    type: integer
                  resources:
                    description: |-
                      Container resource requests/limits. When omitted, the operator
                      applies a safe default (cpu 50m, mem 64Mi requests; mem 128Mi limit)
                      so the pod isn't BestEffort QoS — BestEffort sentinels get throttled
                      into TILT mode under node pressure. To opt out of the default and
                      run BestEffort intentionally, set `resources: {}`.
                    nullable: true
                    properties:
                      limits:
                        additionalProperties:
                          type: string
                        nullable: true
                        type: object
                      requests:
                        additionalProperties:
                          type: string
                        nullable: true
                        type: object
                    type: object
                  storage:
                    description: |-
                      Persistent storage for `sentinel.conf`. When set, sentinels survive
                      pod restarts with their persisted master view, avoiding the brief
                      re-monitor-pod-0 window after an unrelated sentinel restart. When
                      unset, sentinels use emptyDir and rediscover topology via INFO on
                      each restart.
                    nullable: true
                    properties:
                      retention:
                        description: |-
                          PVC retention policy. Mirrors StatefulSet's
                          `persistentVolumeClaimRetentionPolicy`. Both fields default to `Retain`
                          when unset (k8s default), preserving data on scale-down or deletion.
                        nullable: true
                        properties:
                          whenDeleted:
                            description: '"Retain" or "Delete". Applies when the StatefulSet is deleted.'
                            nullable: true
                            type: string
                          whenScaled:
                            description: '"Retain" or "Delete". Applies when the StatefulSet is scaled down.'
                            nullable: true
                            type: string
                        type: object
                      size:
                        default: 1Gi
                        type: string
                      storageClass:
                        nullable: true
                        type: string
                    type: object
                  topologySpreadConstraints:
                    description: |-
                      Overrides the operator's default pod spread for the Sentinel pods. Same
                      soft `maxSkew: 1` hostname default as the Redis pods, selecting only the
                      Sentinel pods so the two workloads spread independently. Set to `[]` to
                      emit no constraints.
                    items:
                      description: TopologySpreadConstraint specifies how to spread matching pods among the given topology.
                      properties:
                        labelSelector:
                          description: LabelSelector is used to find matching pods. Pods that match this label selector are counted to determine the number of pods in their corresponding topology domain.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                              items:
                                description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector applies to.
                                    type: string
                                  operator:
                                    description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                        matchLabelKeys:
                          description: |-
                            MatchLabelKeys is a set of pod label keys to select the pods over which spreading will be calculated. The keys are used to lookup values from the incoming pod labels, those key-value labels are ANDed with labelSelector to select the group of existing pods over which spreading will be calculated for the incoming pod. The same key is forbidden to exist in both MatchLabelKeys and LabelSelector. MatchLabelKeys cannot be set when LabelSelector isn't set. Keys that don't exist in the incoming pod labels will be ignored. A null or empty list means only match against labelSelector.

                            This is a beta field and requires the MatchLabelKeysInPodTopologySpread feature gate to be enabled (enabled by default).
                          items:
                            type: string
                          type: array
                        maxSkew:
                          description: 'MaxSkew describes the degree to which pods may be unevenly distributed. When `whenUnsatisfiable=DoNotSchedule`, it is the maximum permitted difference between the number of matching pods in the target topology and the global minimum. The global minimum is the minimum number of matching pods in an eligible domain or zero if the number of eligible domains is less than MinDomains. For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same labelSelector spread as 2/2/1: In this case, the global minimum is 1. | zone1 | zone2 | zone3 | |  P P  |  P P  |   P   | - if MaxSkew is 1, incoming pod can only be scheduled to zone3 to become 2/2/2; scheduling it onto zone1(zone2) would make the ActualSkew(3-1) on zone1(zone2) violate MaxSkew(1). - if MaxSkew is 2, incoming pod can be scheduled onto any zone. When `whenUnsatisfiable=ScheduleAnyway`, it is used to give higher precedence to topologies that satisfy it. It''s a required field. Default value is 1 and 0 is not allowed.'
                          format: int32
                          type: integer
                        minDomains:
                          description: |-
                            MinDomains indicates a minimum number of eligible domains. When the number of eligible domains with matching topology keys is less than minDomains, Pod Topology Spread treats "global minimum" as 0, and then the calculation of Skew is performed. And when the number of eligible domains with matching topology keys equals or greater than minDomains, this value has no effect on scheduling. As a result, when the number of eligible domains is less than minDomains, scheduler won't schedule more than maxSkew Pods to those domains. If value is nil, the constraint behaves as if MinDomains is equal to 1. Valid values are integers greater than 0. When value is not nil, WhenUnsatisfiable must be DoNotSchedule.

                            For example, in a 3-zone cluster, MaxSkew is set to 2, MinDomains is set to 5 and pods with the same labelSelector spread as 2/2/2: | zone1 | zone2 | zone3 | |  P P  |  P P  |  P P  | The number of domains is less than 5(MinDomains), so "global minimum" is treated as 0. In this situation, new pod with the same labelSelector cannot be scheduled, because computed skew will be 3(3 - 0) if new Pod is scheduled to any of the three zones, it will violate MaxSkew.
                          format: int32
                          type: integer
                        nodeAffinityPolicy:
                          description: |-
                            NodeAffinityPolicy indicates how we will treat Pod's nodeAffinity/nodeSelector when calculating pod topology spread skew. Options are: - Honor: only nodes matching nodeAffinity/nodeSelector are included in the calculations. - Ignore: nodeAffinity/nodeSelector are ignored. All nodes are included in the calculations.

                            If this value is nil, the behavior is equivalent to the Honor policy.
                          type: string
                        nodeTaintsPolicy:
                          description: |-
                            NodeTaintsPolicy indicates how we will treat node taints when calculating pod topology spread skew. Options are: - Honor: nodes without taints, along with tainted nodes for which the incoming pod has a toleration, are included. - Ignore: node taints are ignored. All nodes are included.

                            If this value is nil, the behavior is equivalent to the Ignore policy.
                          type: string
                        topologyKey:
                          description: TopologyKey is the key of node labels. Nodes that have a label with this key and identical values are considered to be in the same topology. We consider each <key, value> as a "bucket", and try to put balanced number of pods into each bucket. We define a domain as a particular instance of a topology. Also, we define an eligible domain as a domain whose nodes meet the requirements of nodeAffinityPolicy and nodeTaintsPolicy. e.g. If TopologyKey is "kubernetes.io/hostname", each Node is a domain of that topology. And, if TopologyKey is "topology.kubernetes.io/zone", each zone is a domain of that topology. It's a required field.
                          type: string
                        whenUnsatisfiable:
                          description: |-
                            WhenUnsatisfiable indicates how to deal with a pod if it doesn't satisfy the spread constraint. - DoNotSchedule (default) tells the scheduler not to schedule it. - ScheduleAnyway tells the scheduler to schedule the pod in any location,
                              but giving higher precedence to topologies that would help reduce the
                              skew.
                            A constraint is considered "Unsatisfiable" for an incoming pod if and only if every possible node assignment for that pod would violate "MaxSkew" on some topology. For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same labelSelector spread as 3/1/1: | zone1 | zone2 | zone3 | | P P P |   P   |   P   | If WhenUnsatisfiable is set to DoNotSchedule, incoming pod can only be scheduled to zone2(zone3) to become 3/2/1(3/1/2) as ActualSkew(2-1) on zone2(zone3) satisfies MaxSkew(1). In other words, the cluster can still be imbalanced, but scheduler won't make it *more* imbalanced. It's a required field.
                          type: string
                      required:
                      - maxSkew
                      - topologyKey
                      - whenUnsatisfiable
                      type: object
                    nullable: true
                    type: array
                type: object
              storage:
                nullable: true
                properties:
                  retention:
                    description: |-
                      PVC retention policy. Mirrors StatefulSet's
                      `persistentVolumeClaimRetentionPolicy`. Both fields default to `Retain`
                      when unset (k8s default), preserving data on scale-down or deletion.
                    nullable: true
                    properties:
                      whenDeleted:
                        description: '"Retain" or "Delete". Applies when the StatefulSet is deleted.'
                        nullable: true
                        type: string
                      whenScaled:
                        description: '"Retain" or "Delete". Applies when the StatefulSet is scaled down.'
                        nullable: true
                        type: string
                    type: object
                  size:
                    default: 1Gi
                    type: string
                  storageClass:
                    nullable: true
                    type: string
                type: object
              topologySpreadConstraints:
                description: |-
                  Overrides the operator's default pod spread for the Redis data pods.

                  By default each workload gets a single soft constraint — `maxSkew: 1`
                  over `kubernetes.io/hostname` with `whenUnsatisfiable: ScheduleAnyway` —
                  selecting its own pods, so the scheduler prefers a different node per pod
                  but still schedules on clusters with fewer nodes than replicas. Set to
                  `[]` to emit no constraints at all.
                items:
                  description: TopologySpreadConstraint specifies how to spread matching pods among the given topology.
                  properties:
                    labelSelector:
                      description: LabelSelector is used to find matching pods. Pods that match this label selector are counted to determine the number of pods in their corresponding topology domain.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                          items:
                            description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector applies to.
                                type: string
                              operator:
                                description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                    matchLabelKeys:
                      description: |-
                        MatchLabelKeys is a set of pod label keys to select the pods over which spreading will be calculated. The keys are used to lookup values from the incoming pod labels, those key-value labels are ANDed with labelSelector to select the group of existing pods over which spreading will be calculated for the incoming pod. The same key is forbidden to exist in both MatchLabelKeys and LabelSelector. MatchLabelKeys cannot be set when LabelSelector isn't set. Keys that don't exist in the incoming pod labels will be ignored. A null or empty list means only match against labelSelector.

                        This is a beta field and requires the MatchLabelKeysInPodTopologySpread feature gate to be enabled (enabled by default).
                      items:
                        type: string
                      type: array
                    maxSkew:
                      description: 'MaxSkew describes the degree to which pods may be unevenly distributed. When `whenUnsatisfiable=DoNotSchedule`, it is the maximum permitted difference between the number of matching pods in the target topology and the global minimum. The global minimum is the minimum number of matching pods in an eligible domain or zero if the number of eligible domains is less than MinDomains. For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same labelSelector spread as 2/2/1: In this case, the global minimum is 1. | zone1 | zone2 | zone3 | |  P P  |  P P  |   P   | - if MaxSkew is 1, incoming pod can only be scheduled to zone3 to become 2/2/2; scheduling it onto zone1(zone2) would make the ActualSkew(3-1) on zone1(zone2) violate MaxSkew(1). - if MaxSkew is 2, incoming pod can be scheduled onto any zone. When `whenUnsatisfiable=ScheduleAnyway`, it is used to give higher precedence to topologies that satisfy it. It''s a required field. Default value is 1 and 0 is not allowed.'
                      format: int32
                      type: integer
                    minDomains:
                      description: |-
                        MinDomains indicates a minimum number of eligible domains. When the number of eligible domains with matching topology keys is less than minDomains, Pod Topology Spread treats "global minimum" as 0, and then the calculation of Skew is performed. And when the number of eligible domains with matching topology keys equals or greater than minDomains, this value has no effect on scheduling. As a result, when the number of eligible domains is less than minDomains, scheduler won't schedule more than maxSkew Pods to those domains. If value is nil, the constraint behaves as if MinDomains is equal to 1. Valid values are integers greater than 0. When value is not nil, WhenUnsatisfiable must be DoNotSchedule.

                        For example, in a 3-zone cluster, MaxSkew is set to 2, MinDomains is set to 5 and pods with the same labelSelector spread as 2/2/2: | zone1 | zone2 | zone3 | |  P P  |  P P  |  P P  | The number of domains is less than 5(MinDomains), so "global minimum" is treated as 0. In this situation, new pod with the same labelSelector cannot be scheduled, because computed skew will be 3(3 - 0) if new Pod is scheduled to any of the three zones, it will violate MaxSkew.
                      format: int32
                      type: integer
                    nodeAffinityPolicy:
                      description: |-
                        NodeAffinityPolicy indicates how we will treat Pod's nodeAffinity/nodeSelector when calculating pod topology spread skew. Options are: - Honor: only nodes matching nodeAffinity/nodeSelector are included in the calculations. - Ignore: nodeAffinity/nodeSelector are ignored. All nodes are included in the calculations.

                        If this value is nil, the behavior is equivalent to the Honor policy.
                      type: string
                    nodeTaintsPolicy:
                      description: |-
                        NodeTaintsPolicy indicates how we will treat node taints when calculating pod topology spread skew. Options are: - Honor: nodes without taints, along with tainted nodes for which the incoming pod has a toleration, are included. - Ignore: node taints are ignored. All nodes are included.

                        If this value is nil, the behavior is equivalent to the Ignore policy.
                      type: string
                    topologyKey:
                      description: TopologyKey is the key of node labels. Nodes that have a label with this key and identical values are considered to be in the same topology. We consider each <key, value> as a "bucket", and try to put balanced number of pods into each bucket. We define a domain as a particular instance of a topology. Also, we define an eligible domain as a domain whose nodes meet the requirements of nodeAffinityPolicy and nodeTaintsPolicy. e.g. If TopologyKey is "kubernetes.io/hostname", each Node is a domain of that topology. And, if TopologyKey is "topology.kubernetes.io/zone", each zone is a domain of that topology. It's a required field.
                      type: string
                    whenUnsatisfiable:
                      description: |-
                        WhenUnsatisfiable indicates how to deal with a pod if it doesn't satisfy the spread constraint. - DoNotSchedule (default) tells the scheduler not to schedule it. - ScheduleAnyway tells the scheduler to schedule the pod in any location,
                          but giving higher precedence to topologies that would help reduce the
                          skew.
                        A constraint is considered "Unsatisfiable" for an incoming pod if and only if every possible node assignment for that pod would violate "MaxSkew" on some topology. For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same labelSelector spread as 3/1/1: | zone1 | zone2 | zone3 | | P P P |   P   |   P   | If WhenUnsatisfiable is set to DoNotSchedule, incoming pod can only be scheduled to zone2(zone3) to become 3/2/1(3/1/2) as ActualSkew(2-1) on zone2(zone3) satisfies MaxSkew(1). In other words, the cluster can still be imbalanced, but scheduler won't make it *more* imbalanced. It's a required field.
                      type: string
                  required:
                  - maxSkew
                  - topologyKey
                  - whenUnsatisfiable
                  type: object
                nullable: true
                type: array
            type: object
          status:
            nullable: true
            properties:
              connectedReplicas:
                default: 0
                description: |-
                  `connected_slaves` reported by `INFO replication` on the primary.
                  Zero when `replicas == 1` (no replicas configured) or before the
                  primary becomes ready.
                format: int32
                type: integer
              masterPod:
                description: |-
                  Pod name (short form) of the current master. Easier to read than the
                  full FQDN and matches what `kubectl get pods` shows.
                nullable: true
                type: string
              phase:
                nullable: true
                type: string
              primaryHost:
                description: |-
                  FQDN of the current master. Tracks Sentinel-driven failovers when
                  Sentinel is enabled; otherwise always pod-0.
                nullable: true
                type: string
              readyReplicas:
                default: 0
                format: int32
                type: integer
              sentinelReplicasReady:
                default: 0
                description: |-
                  Number of Sentinel pods that report ready. Zero when Sentinel is
                  disabled.
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: Redis
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redisclusters.redis.jgaskins.dev
spec:
  group: redis.jgaskins.dev
  names:
    categories: []
    kind: RedisCluster
    plural: redisclusters
    shortNames:
    - rdsc
    singular: rediscluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.masters
      name: Masters
      type: integer
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - description: Slots assigned (16384 when fully populated)
      jsonPath: .status.slotsAssigned
      name: Slots
      type: integer
    - description: Replica imbalance (0 when fully balanced)
      jsonPath: .status.replicaImbalance
      name: Imbalance
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RedisClusterSpec via `CustomResource`
        properties:
          spec:
            properties:
              evictionPolicy:
                description: |-
                  Redis's `maxmemory-policy`: what to do with the keyspace once `maxmemory`
                  is reached. Modelled as an enum for the same reason `FsyncPolicy` is — the
                  API server rejects a bad value at `kubectl apply` time, where redis-server
                  would refuse to start and surface it as a CrashLoopBackOff instead.

                  The `allkeys-*` variants may evict any key; the `volatile-*` variants only
                  consider keys carrying a TTL, and behave like `noeviction` when none of the
                  keys in memory have one — a cache built without TTLs gets write errors under
                  a `volatile-*` policy, not evictions.

                  Two things to weigh before moving off the default:

                  - Eviction deletes committed data. An evicted key is dropped from the RDB
                    and AOF along with everything else, so anything but `noeviction` turns the
                    deployment into a cache whether or not persistence is on.
                  - The ceiling is per pod. `maxmemory` is one node's limit, so under Redis
                    Cluster the fullest shard starts evicting while the rest may be near
                    empty, and the policy applies to every pod because a StatefulSet has a
                    single pod template. Replicas don't evict independently — since Redis 5
                    they wait for the primary's `DEL` — so it only acts on the current master.
                enum:
                - noeviction
                - allkeys-lru
                - allkeys-lfu
                - allkeys-random
                - volatile-lru
                - volatile-lfu
                - volatile-random
                - volatile-ttl
                nullable: true
                type: string
              image:
                default: redis:8
                type: string
              masters:
                default: 3
                format: int32
                type: integer
              persistence:
                description: |-
                  How the dataset is written to disk. Defaults to both RDB and AOF on,
                  with AOF fsyncing once a second. See `PersistenceSpec`.

                  `/data` is mounted regardless of this setting, because the cluster's
                  `nodes.conf` — the file holding each pod's cluster identity and slot
                  map — lives there whether or not the dataset is persisted.
                nullable: true
                properties:
                  aof:
                    description: Append-only file logging.
                    nullable: true
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      fsync:
                        description: |-
                          Redis's `appendfsync` policy. Modelled as an enum so the API server rejects
                          a bad value at `kubectl apply` time — redis-server refuses to start on an
                          unrecognised one, which would otherwise surface as a CrashLoopBackOff.

                          The third variant is spelled `never` rather than Redis's own `no`. `no` is
                          unusable as a schema enum value here: serde_yaml emits it bare (YAML 1.2,
                          where it is a string), but the API server parses CRDs with go-yaml's YAML
                          1.1, where bare `no` is the boolean `false` — which would land a boolean
                          inside a `type: string` enum and make the value unmatchable. Spelling it
                          `never` sidesteps that, and spares users the same quoting trap in their own
                          manifests. It maps to `appendfsync no` on the redis-server command line.
                        enum:
                        - always
                        - everysec
                        - never
                        nullable: true
                        type: string
                    type: object
                  enabled:
                    default: true
                    description: |-
                      Master switch. When false, both RDB and AOF are disabled regardless of
                      the `rdb` and `aof` blocks below and Redis runs as a pure in-memory
                      cache, losing its dataset on every restart.
                    type: boolean
                  rdb:
                    description: Point-in-time snapshotting (`save` / `BGSAVE`).
                    nullable: true
                    properties:
                      enabled:
                        default: true
                        type: boolean
                      save:
                        description: |-
                          Snapshot triggers, each `"<seconds> <changes>"` — snapshot when at
                          least `changes` keys changed within `seconds`. Defaults to Redis's own
                          `3600 1`, `300 100`, `60 10000`.

                          An empty list schedules no automatic snapshots, which is the same thing
                          `enabled: false` does: both emit `--save ""`. Neither stops Redis from
                          producing an RDB for a replication full sync or an explicit `BGSAVE` —
                          there is no Redis setting that does.
                        items:
                          pattern: ^\d+ \d+$
                          type: string
                        nullable: true
                        type: array
                    type: object
                type: object
              podDisruptionBudget:
                description: |-
                  PodDisruptionBudget for the cluster's pods. Opt-in, and validated against
                  the topology: the safe maximum is the smaller of the master-majority
                  slack `(masters - 1) / 2` and `replicasPerMaster`. For the default
                  3-by-1 cluster that is 1. An unsafe budget is refused rather than
                  applied — see `PodDisruptionBudgetSpec`.
                nullable: true
                properties:
                  maxUnavailable:
                    description: Integer or percentage. Mutually exclusive with `minAvailable`.
                    nullable: true
                    x-kubernetes-int-or-string: true
                  minAvailable:
                    description: Integer or percentage (e.g. `1` or `"50%"`).
                    nullable: true
                    x-kubernetes-int-or-string: true
                  unhealthyPodEvictionPolicy:
                    description: |-
                      `IfHealthyBudget` (the Kubernetes default) or `AlwaysAllow`.

                      Under `IfHealthyBudget`, a pod that is *already* unready cannot be
                      evicted once the budget is spent — which stalls `kubectl drain` during
                      exactly the incident you are draining for. `AlwaysAllow` lets an
                      already-unready pod go, since it is not serving traffic anyway, while
                      healthy pods are still held to the budget. Requires Kubernetes 1.27+
                      (GA in 1.31); older API servers silently drop the field.
                    nullable: true
                    type: string
                type: object
              replicasPerMaster:
                default: 1
                format: int32
                type: integer
              resources:
                description: |-
                  Container resource requests/limits for each cluster pod. Defaults:
                  1Gi memory (requests and limits), 1.2 CPU requests, 2 CPU limits.
                  User values are merged per-key with the defaults — overriding `cpu`
                  alone preserves the default memory settings, and vice versa.

                  `maxmemory` is derived from the effective memory limit (70%) and
                  passed to redis-server, so users don't need to keep it in sync
                  manually.
                nullable: true
                properties:
                  limits:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                  requests:
                    additionalProperties:
                      type: string
                    nullable: true
                    type: object
                type: object
              storage:
                nullable: true
                properties:
                  retention:
                    description: |-
                      PVC retention policy. Mirrors StatefulSet's
                      `persistentVolumeClaimRetentionPolicy`. Both fields default to `Retain`
                      when unset (k8s default), preserving data on scale-down or deletion.
                    nullable: true
                    properties:
                      whenDeleted:
                        description: '"Retain" or "Delete". Applies when the StatefulSet is deleted.'
                        nullable: true
                        type: string
                      whenScaled:
                        description: '"Retain" or "Delete". Applies when the StatefulSet is scaled down.'
                        nullable: true
                        type: string
                    type: object
                  size:
                    default: 1Gi
                    type: string
                  storageClass:
                    nullable: true
                    type: string
                type: object
              topologySpreadConstraints:
                description: |-
                  Overrides the operator's default pod spread.

                  By default the cluster's pods get a single soft constraint — `maxSkew: 1`
                  over `kubernetes.io/hostname` with `whenUnsatisfiable: ScheduleAnyway` —
                  so the scheduler prefers to put every pod on a different node but still
                  schedules on clusters with fewer nodes than pods. This matters more here
                  than a PodDisruptionBudget does: a budget only rate-limits *voluntary*
                  eviction, so without spreading, losing one node can still take the whole
                  cluster down. Set to `[]` to emit no constraints at all.
                items:
                  description: TopologySpreadConstraint specifies how to spread matching pods among the given topology.
                  properties:
                    labelSelector:
                      description: LabelSelector is used to find matching pods. Pods that match this label selector are counted to determine the number of pods in their corresponding topology domain.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                          items:
                            description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector applies to.
                                type: string
                              operator:
                                description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                    matchLabelKeys:
                      description: |-
                        MatchLabelKeys is a set of pod label keys to select the pods over which spreading will be calculated. The keys are used to lookup values from the incoming pod labels, those key-value labels are ANDed with labelSelector to select the group of existing pods over which spreading will be calculated for the incoming pod. The same key is forbidden to exist in both MatchLabelKeys and LabelSelector. MatchLabelKeys cannot be set when LabelSelector isn't set. Keys that don't exist in the incoming pod labels will be ignored. A null or empty list means only match against labelSelector.

                        This is a beta field and requires the MatchLabelKeysInPodTopologySpread feature gate to be enabled (enabled by default).
                      items:
                        type: string
                      type: array
                    maxSkew:
                      description: 'MaxSkew describes the degree to which pods may be unevenly distributed. When `whenUnsatisfiable=DoNotSchedule`, it is the maximum permitted difference between the number of matching pods in the target topology and the global minimum. The global minimum is the minimum number of matching pods in an eligible domain or zero if the number of eligible domains is less than MinDomains. For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same labelSelector spread as 2/2/1: In this case, the global minimum is 1. | zone1 | zone2 | zone3 | |  P P  |  P P  |   P   | - if MaxSkew is 1, incoming pod can only be scheduled to zone3 to become 2/2/2; scheduling it onto zone1(zone2) would make the ActualSkew(3-1) on zone1(zone2) violate MaxSkew(1). - if MaxSkew is 2, incoming pod can be scheduled onto any zone. When `whenUnsatisfiable=ScheduleAnyway`, it is used to give higher precedence to topologies that satisfy it. It''s a required field. Default value is 1 and 0 is not allowed.'
                      format: int32
                      type: integer
                    minDomains:
                      description: |-
                        MinDomains indicates a minimum number of eligible domains. When the number of eligible domains with matching topology keys is less than minDomains, Pod Topology Spread treats "global minimum" as 0, and then the calculation of Skew is performed. And when the number of eligible domains with matching topology keys equals or greater than minDomains, this value has no effect on scheduling. As a result, when the number of eligible domains is less than minDomains, scheduler won't schedule more than maxSkew Pods to those domains. If value is nil, the constraint behaves as if MinDomains is equal to 1. Valid values are integers greater than 0. When value is not nil, WhenUnsatisfiable must be DoNotSchedule.

                        For example, in a 3-zone cluster, MaxSkew is set to 2, MinDomains is set to 5 and pods with the same labelSelector spread as 2/2/2: | zone1 | zone2 | zone3 | |  P P  |  P P  |  P P  | The number of domains is less than 5(MinDomains), so "global minimum" is treated as 0. In this situation, new pod with the same labelSelector cannot be scheduled, because computed skew will be 3(3 - 0) if new Pod is scheduled to any of the three zones, it will violate MaxSkew.
                      format: int32
                      type: integer
                    nodeAffinityPolicy:
                      description: |-
                        NodeAffinityPolicy indicates how we will treat Pod's nodeAffinity/nodeSelector when calculating pod topology spread skew. Options are: - Honor: only nodes matching nodeAffinity/nodeSelector are included in the calculations. - Ignore: nodeAffinity/nodeSelector are ignored. All nodes are included in the calculations.

                        If this value is nil, the behavior is equivalent to the Honor policy.
                      type: string
                    nodeTaintsPolicy:
                      description: |-
                        NodeTaintsPolicy indicates how we will treat node taints when calculating pod topology spread skew. Options are: - Honor: nodes without taints, along with tainted nodes for which the incoming pod has a toleration, are included. - Ignore: node taints are ignored. All nodes are included.

                        If this value is nil, the behavior is equivalent to the Ignore policy.
                      type: string
                    topologyKey:
                      description: TopologyKey is the key of node labels. Nodes that have a label with this key and identical values are considered to be in the same topology. We consider each <key, value> as a "bucket", and try to put balanced number of pods into each bucket. We define a domain as a particular instance of a topology. Also, we define an eligible domain as a domain whose nodes meet the requirements of nodeAffinityPolicy and nodeTaintsPolicy. e.g. If TopologyKey is "kubernetes.io/hostname", each Node is a domain of that topology. And, if TopologyKey is "topology.kubernetes.io/zone", each zone is a domain of that topology. It's a required field.
                      type: string
                    whenUnsatisfiable:
                      description: |-
                        WhenUnsatisfiable indicates how to deal with a pod if it doesn't satisfy the spread constraint. - DoNotSchedule (default) tells the scheduler not to schedule it. - ScheduleAnyway tells the scheduler to schedule the pod in any location,
                          but giving higher precedence to topologies that would help reduce the
                          skew.
                        A constraint is considered "Unsatisfiable" for an incoming pod if and only if every possible node assignment for that pod would violate "MaxSkew" on some topology. For example, in a 3-zone cluster, MaxSkew is set to 1, and pods with the same labelSelector spread as 3/1/1: | zone1 | zone2 | zone3 | | P P P |   P   |   P   | If WhenUnsatisfiable is set to DoNotSchedule, incoming pod can only be scheduled to zone2(zone3) to become 3/2/1(3/1/2) as ActualSkew(2-1) on zone2(zone3) satisfies MaxSkew(1). In other words, the cluster can still be imbalanced, but scheduler won't make it *more* imbalanced. It's a required field.
                      type: string
                  required:
                  - maxSkew
                  - topologyKey
                  - whenUnsatisfiable
                  type: object
                nullable: true
                type: array
            type: object
          status:
            nullable: true
            properties:
              clusterState:
                description: Raw `cluster_state` from Redis (`ok`, `fail`, etc.).
                nullable: true
                type: string
              masters:
                default: 0
                description: Number of masters currently in the cluster.
                format: int32
                type: integer
              nodes:
                description: Per-node breakdown, sorted by hostname for stable diffs.
                items:
                  properties:
                    hostname:
                      description: Announced hostname (typically `<sts>-<ord>.<sts>.<ns>.svc.cluster.local`).
                      type: string
                    id:
                      description: Redis Cluster node ID (40-char hex).
                      type: string
                    masterId:
                      description: For replicas, the ID of the master they replicate. Empty for masters.
                      type: string
                    replicaCount:
                      default: 0
                      description: For masters, number of replicas attached. Always 0 for replicas.
                      format: int32
                      type: integer
                    role:
                      description: '`master` or `replica`.'
                      type: string
                    slotCount:
                      default: 0
                      description: For masters, number of slots owned. Always 0 for replicas.
                      format: int32
                      type: integer
                  required:
                  - hostname
                  - id
                  - role
                  type: object
                type: array
              phase:
                description: |-
                  High-level rollup. `Running` only when cluster_state=ok, all 16384 slots
                  are assigned, and replicas are perfectly distributed; otherwise `Degraded`
                  or `Pending`.
                nullable: true
                type: string
              readyNodes:
                default: 0
                description: '`cluster_known_nodes` from Redis — total nodes the cluster reports.'
                format: int32
                type: integer
              replicaImbalance:
                default: 0
                description: |-
                  Sum of `|observed_replicas - replicasPerMaster|` across all masters.
                  Zero when every master has exactly the desired number of replicas.
                format: int32
                type: integer
              replicas:
                default: 0
                description: Number of replicas currently in the cluster.
                format: int32
                type: integer
              slotsAssigned:
                default: 0
                description: Sum of slots owned across all masters. 16384 when fully assigned.
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: RedisCluster
        type: object
    served: true
    storage: true
    subresources:
      status: {}
